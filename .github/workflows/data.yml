name: Update market data snapshot

# هر ۶ ساعت یک عکس فوری از قیمت‌ها و نمودارها می‌سازد (پوشه‌ی data)
# تا اگر منبع زنده از مرورگر بازدیدکننده جواب نداد، نمودار خالی نماند.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data
        run: node scripts/fetch-data.mjs
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "بدون تغییر"
          else
            git commit -m "Update market data snapshot"
            git push
            # push با توکن خودکار، workflow دیگری را راه نمی‌اندازد؛ انتشار را دستی صدا می‌زنیم
            gh workflow run pages.yml
          fi
