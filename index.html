<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mirza</title>

<style>
body{
    margin:0;
    background:#080a0f;
    color:white;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logo{
    color:#f2ce75;
    font-size:28px;
    font-weight:bold;
}

.status{
    color:#777;
    font-size:12px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:#11151d;
    border:1px solid #252b35;
    border-radius:18px;
    padding:25px;
}

.title{
    color:#888;
    font-size:13px;
    margin-bottom:20px;
}

.price{
    color:#f2ce75;
    font-size:25px;
    font-weight:bold;
}

.change{
    margin-top:12px;
    color:#38c172;
}

@media(max-width:800px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">MIRZA</div>
    <div class="status">داشبورد بازارهای مالی</div>
</header>

<div class="cards">

<div class="card">
    <div class="title">🟡 طلای ۱۸ عیار</div>
    <div class="price" id="gold">در حال دریافت...</div>
    <div class="change" id="goldChange">---</div>
</div>

<div class="card">
    <div class="title">💵 دلار</div>
    <div class="price" id="dollar">در حال دریافت...</div>
    <div class="change" id="dollarChange">---</div>
</div>

<div class="card">
    <div class="title">₿ بیت‌کوین</div>
    <div class="price" id="bitcoin">در حال دریافت...</div>
    <div class="change" id="bitcoinChange">---</div>
</div>

<div class="card">
    <div class="title">Ξ اتریوم</div>
    <div class="price" id="ethereum">در حال دریافت...</div>
    <div class="change" id="ethereumChange">---</div>
</div>

</div>

</div>

</body>
</html>
