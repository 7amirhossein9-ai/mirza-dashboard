<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mirza | داشبورد بازارهای مالی</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#080a0f;
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.logo{
    color:#f2ce75;
    font-size:28px;
    font-weight:bold;
}

.status{
    color:#777;
    font-size:12px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:#10141c;
    border:1px solid #252b36;
    border-radius:18px;
    padding:22px;
    transition:.2s;
}

.card:hover{
    border-color:#b98a35;
    transform:translateY(-3px);
}

.card-title{
    color:#8d95a3;
    font-size:13px;
    margin-bottom:18px;
}

.price{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
    color:#f2ce75;
}

.change{
    font-size:13px;
}

.up{
    color:#38c172;
}

.down{
    color:#e05252;
}

.time{
    color:#666;
    font-size:10px;
    margin-top:12px;
}

.section{
    margin-top:30px;
    background:#10141c;
    border:1px solid #252b36;
    border-radius:18px;
    padding:25px;
}

.section h2{
    color:#f2ce75;
    margin-bottom:12px;
}

.section p{
    color:#888;
    font-size:13px;
}

@media(max-width:900px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .container{
        padding:15px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .price{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div
